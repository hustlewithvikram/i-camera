name: Build Release APK

on:
  workflow_dispatch:

concurrency:
  group: icamera-release-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install stable Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          curl -fsSL "https://android.googlesource.com/platform/frameworks/support/+/bf0289331e88399e38f5486200199bc857932e24/development/keystore/debug.keystore?format=TEXT" |
            tr -d '\n' |
            base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -v |
            grep -E "Alias name:|SHA256:"

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;35.0.0"

      - name: Set monotonic version code
        run: echo "VERSION_CODE=$(( $(git rev-list --count HEAD) + 1000 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace -PversionCode="$VERSION_CODE" assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: iCamera-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
