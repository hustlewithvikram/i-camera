<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">iCamera</title>
  <desc id="desc">A dark, minimal camera interface inspired by modern smartphone camera apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#161616"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#6f7680"/>
      <stop offset="0.32" stop-color="#24282d"/>
      <stop offset="0.62" stop-color="#08090a"/>
      <stop offset="0.82" stop-color="#535961"/>
      <stop offset="1" stop-color="#111214"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="260" fill="#ffffff" opacity=".035"/>
  <circle cx="80" cy="1710" r="360" fill="#ffffff" opacity=".025"/>

  <g transform="translate(390 250)" filter="url(#shadow)">
    <rect width="300" height="300" rx="72" fill="#111214" stroke="#3b3d40" stroke-width="4"/>
    <rect x="55" y="72" width="190" height="155" rx="48" fill="#24272b" stroke="#777c82" stroke-width="6"/>
    <circle cx="150" cy="150" r="66" fill="url(#lens)" stroke="#a4a8ad" stroke-width="5"/>
    <circle cx="150" cy="150" r="27" fill="#030405"/>
    <circle cx="135" cy="134" r="9" fill="#ffffff" opacity=".55"/>
    <rect x="92" y="48" width="55" height="18" rx="9" fill="#777c82"/>
  </g>

  <text x="540" y="720" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3">iCamera</text>
  <text x="540" y="805" text-anchor="middle" fill="#b9b9b9" font-family="Inter, Arial, sans-serif" font-size="38">iPhone-inspired camera experience for Android</text>

  <g transform="translate(135 1030)">
    <rect width="810" height="480" rx="64" fill="#0b0c0d" stroke="#343638" stroke-width="3"/>
    <rect x="42" y="42" width="726" height="286" rx="42" fill="#151719"/>
    <circle cx="405" cy="185" r="92" fill="url(#lens)" stroke="#8b9096" stroke-width="4"/>
    <circle cx="405" cy="185" r="38" fill="#020303"/>
    <circle cx="382" cy="162" r="12" fill="#fff" opacity=".45"/>
    <rect x="54" y="370" width="150" height="18" rx="9" fill="#4b4e52"/>
    <rect x="230" y="370" width="210" height="18" rx="9" fill="#74787d"/>
    <rect x="466" y="370" width="118" height="18" rx="9" fill="#4b4e52"/>
    <rect x="610" y="370" width="108" height="18" rx="9" fill="#303236"/>
  </g>

  <text x="540" y="1645" text-anchor="middle" fill="#8f9398" font-family="Inter, Arial, sans-serif" font-size="30">KOTLIN  •  JETPACK COMPOSE  •  CAMERA2 / CAMERAX</text>
  <text x="540" y="1710" text-anchor="middle" fill="#666a6f" font-family="Inter, Arial, sans-serif" font-size="26">Capability-driven • Hardware-aware • Native Android</text>
</svg>